<title>NJENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:linear-gradient(100deg,#6b4a12 0%,#c9972b 16%,#fff3b0 36%,#d4a437 52%,#8a6114 68%,#f6e27a 86%,#a87a1e 100%);--g1:#f6e27a;--g2:#c9972b;--e:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color:#f2efe8;font:400 14px Manrope,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 62% -10%,#2a1f0a,#0b0904 55%,#000) #000}
.logo,.hub,#title,.cap,#play,.box h3{font-family:Cinzel,Georgia,serif}
.gt{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bm{position:absolute;top:-25%;width:13vmax;height:160vh;transform-origin:top center;background:linear-gradient(rgba(246,226,122,.11),transparent 75%);filter:blur(7px);animation:sw 20s ease-in-out infinite alternate}
.b1{left:30%;--r:18deg}.b2{left:50%;--r:28deg;animation-duration:26s;animation-delay:-8s}.b3{left:68%;--r:38deg;animation-duration:23s;animation-delay:-14s}
@keyframes sw{from{transform:rotate(calc(var(--r) - 7deg))}to{transform:rotate(calc(var(--r) + 7deg))}}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 60% 40%,transparent 30%,#000e 100%)}
#stage{position:fixed;inset:0;z-index:2;overflow:hidden}
html.rot #stage{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
#app{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden}#app.on{visibility:visible}
#boot{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 58%,#1d1508,#050403 62%,#000);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1.2s var(--e)}
#boot.hide{opacity:0;pointer-events:none}
#rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax;background:repeating-conic-gradient(from 0deg,#f6e27a00 0 8deg,#f6e27a14 9deg 10deg,#f6e27a00 11deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);opacity:0;transition:opacity 2.5s}
#boot.lit #rays{opacity:1;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3b0;box-shadow:0 0 20px #f6e27a,0 0 60px #c9972b;opacity:0}
#boot.go #dot{animation:dt 2.4s ease-in-out forwards}
@keyframes dt{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.5)}}
#line{position:absolute;left:10%;right:10%;top:0;bottom:0;margin:auto 0;height:2px;background:linear-gradient(90deg,transparent,#fff3b0,#f6e27a,#fff3b0,transparent);box-shadow:0 0 24px #f6e27a,0 0 70px #c9972b;transform:scaleX(0);opacity:0}
#boot.go #line{animation:ln1 2.6s 1.6s var(--e) forwards}
@keyframes ln1{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:.55}}
#boot.open #line{animation:ln2 2.4s var(--e) forwards}
@keyframes ln2{from{transform:scaleX(1);opacity:.55;height:2px}to{transform:scaleX(1);opacity:0;height:90%}}
#bloom{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,#f6e27a55,#c9972b22 35%,transparent 65%);opacity:0;transform:scale(.3);transition:all 5s var(--e)}
#boot.lit #bloom{opacity:1;transform:scale(1)}
#stg{position:relative;perspective:900px;text-align:center}
#reveal{display:flex;justify-content:center;font:900 clamp(34px,10vw,104px) Cinzel,Georgia,serif;letter-spacing:.06em;-webkit-box-reflect:below -4px linear-gradient(transparent 55%,#0007)}
#reveal span{display:inline-block;opacity:0;transform:translateZ(-300px) rotateX(80deg) scale(1.5);filter:blur(14px);transition:all 1.9s var(--e);background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#reveal span.in{opacity:1;transform:none;filter:none}
#reveal.sh span{animation:shn 2.6s ease-in-out infinite}
@keyframes shn{0%{background-position:100% 0}100%{background-position:0 0}}
#sub{margin-top:10px;font:600 clamp(9px,1.6vw,13px) Manrope;letter-spacing:.5em;color:#d9d3c2;opacity:0;transition:opacity 2s}#sub.in{opacity:1}
#term{position:absolute;left:22px;bottom:16px;font:11px/1.9 ui-monospace,monospace;color:#8d7a4a;transition:opacity 1s}
#boot.open #term{opacity:0}
#term div{opacity:0;transition:opacity .4s}#term div.on{opacity:1}#term b{font-weight:600}#term .ok{color:var(--g1)}#term .er{color:#e8867a}
#boot.glitch #term{animation:gl .45s steps(2) 3}
@keyframes gl{25%{transform:translate(4px,0);filter:hue-rotate(40deg)}75%{transform:translate(-4px,1px)}}
#floor{position:absolute;left:-50%;right:-50%;bottom:-6%;height:62%;background:repeating-linear-gradient(90deg,#c9972b40 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,#c9972b40 0 1px,transparent 1px 64px);transform:perspective(420px) rotateX(68deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000 65%);mask:linear-gradient(transparent,#000 65%);opacity:0;transition:opacity 5s;animation:gr 3.4s linear infinite}
#boot.go #floor{opacity:.75}
@keyframes gr{to{background-position:0 0,0 64px}}
#dust{position:absolute;inset:0;pointer-events:none}
#dust i{position:absolute;border-radius:50%;background:#f6e27a;box-shadow:0 0 6px #f6e27a;opacity:0;animation:df 9s linear infinite}
@keyframes df{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(-160px)}}
#rings{position:absolute;width:min(72vmin,540px);height:min(72vmin,540px);perspective:700px;opacity:0;transition:opacity 3s}
#boot.lit #rings{opacity:1}
#rings i{position:absolute;inset:0;border-radius:50%;border:1px solid #f6e27a99;box-shadow:0 0 22px #c9972b66,inset 0 0 22px #c9972b33;animation:rg1 14s linear infinite}
#rings i:nth-child(2){inset:9%;border-color:#fff3b066;animation:rg2 19s linear infinite}
#rings i:nth-child(3){inset:19%;border-style:dashed;animation-duration:11s;animation-direction:reverse}
@keyframes rg1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes rg2{from{transform:rotateY(72deg) rotateZ(0)}to{transform:rotateY(72deg) rotateZ(-360deg)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:60;pointer-events:none;transition:opacity .45s ease-in}
.top{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;border-bottom:1px solid #c9972b33;background:linear-gradient(#000c,transparent);backdrop-filter:blur(10px)}
.logo{font-size:17px;font-weight:900;letter-spacing:.14em}
#app.on .logo{animation:lg 1.8s var(--e) both}
@keyframes lg{from{letter-spacing:.7em;opacity:0;filter:blur(8px)}}
.st{display:flex;gap:14px;align-items:center;font-size:12px;color:#b9b2a0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g1);box-shadow:0 0 8px var(--g1);margin-right:6px}.dot.off{background:#d55;box-shadow:0 0 8px #d55}
.usr{width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px #000,0 0 0 1px #c9972b}
button{font:inherit;color:inherit;background:none;border:1px solid #c9972b66;border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .4s var(--e)}
button:hover{border-color:var(--g1)}button:active{transform:scale(.97)}
button:focus-visible,.tile:focus-visible{outline:2px solid var(--g1);outline-offset:3px;box-shadow:0 0 24px #f6e27a88}
button:disabled{opacity:.4;cursor:default}
#main{flex:1;display:flex;min-height:0}
#hubs{position:relative;width:clamp(150px,25%,290px);flex:none;overflow:hidden}
#app.on #hubs{animation:inl 1.4s .5s var(--e) both}
@keyframes inl{from{opacity:0;translate:-50px 0}}
#hubs::after{content:"";position:absolute;left:0;top:50%;width:3px;height:38px;transform:translateY(-50%);background:var(--gold);box-shadow:0 0 16px #f6e27a}
.hub{position:absolute;left:22px;top:50%;font-weight:700;font-size:clamp(17px,3vw,31px);letter-spacing:.1em;white-space:nowrap;border:0;border-radius:0;padding:4px 0;transition:all .9s var(--e);transform-origin:left center;color:#fff}
.hub.sel{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px #c9972b88)}
.hub sup{font:700 .42em Manrope;margin-left:.4em;vertical-align:super}
.hub.pulse{animation:pu 1s var(--e)}
@keyframes pu{40%{filter:drop-shadow(0 0 24px #f6e27a) brightness(1.6);scale:1.12}}
#right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#row{flex:1;position:relative;perspective:1100px;overflow:hidden;touch-action:none;cursor:grab;min-height:0}
#row.dragging{cursor:grabbing}#row.dragging .tile{transition:none}
.tile{position:absolute;left:50%;top:46%;width:var(--tw,180px);aspect-ratio:3/4;border-radius:12px;padding:3px;background:linear-gradient(135deg,#6b4a12,#f6e27a 30%,#8a6114 55%,#fff3b0 75%,#a87a1e);box-shadow:1px 1px 0 #6b4a12,2px 2px 0 #4a3309,3px 3px 0 #2a1d05,0 30px 60px #000;transition:transform 1s var(--e),filter 1s var(--e),opacity 1s var(--e);will-change:transform;cursor:pointer;-webkit-box-reflect:below 3px linear-gradient(transparent 66%,#0008)}
.face{position:absolute;inset:3px;border-radius:9px;overflow:hidden;background:center/cover no-repeat}
.face::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff26,transparent 40%);z-index:2}
.face::after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(circle at var(--mx,30%) var(--my,15%),#fff9,transparent 45%);mix-blend-mode:soft-light;opacity:0;transition:opacity .8s}
.tile.focus .face::after{opacity:1}
.tile.focus{box-shadow:1px 1px 0 #6b4a12,2px 2px 0 #4a3309,3px 3px 0 #2a1d05,0 0 60px #c9972b77,0 30px 60px #000;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{translate:0 -7px}}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(40px,9vw,90px) Cinzel;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.85}
.cap{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 9px;background:linear-gradient(transparent,#000f);font-size:11px;font-weight:700;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.empty .face{background:radial-gradient(circle at 50% 38%,#1b1508,#030303);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#b9a56a;font-size:11px;line-height:1.55;padding:10px;gap:9px}
.empty svg,.up svg{width:44%;color:var(--g1);filter:drop-shadow(0 0 8px #c9972b)}
.empty svg{animation:sp 16s linear infinite}.up svg{animation:sp 2.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bd{position:absolute;top:8px;right:8px;z-index:4;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1204;font:700 12px/22px Manrope;text-align:center;font-style:normal;box-shadow:0 0 12px #c9972b}
.up{position:absolute;inset:0;z-index:5;background:#000c;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:11px;line-height:1.4;color:var(--g1);text-align:center;padding:8px}
.up.fail{color:#e8867a}.up.fail svg{animation:none;filter:drop-shadow(0 0 8px #c0554a)}
#sys{position:absolute;inset:0;display:none;align-items:center;justify-content:center}#sys.on{display:flex}
.box{width:min(420px,88%);padding:20px;border-radius:14px;background:linear-gradient(#ffffff14,#ffffff05);border:1px solid #c9972b55;backdrop-filter:blur(14px);line-height:1.7;font-size:13px;color:#cfc8b6}
.box h3{font-size:15px;letter-spacing:.15em;margin-bottom:10px}.box p{margin-bottom:10px}
#info{position:relative;margin:0 16px 8px 8px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#ffffff16,#ffffff05);border:1px solid #c9972b55;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:14px;transition:opacity .6s}
#app.on #info{animation:inb 1.2s 1s var(--e) both}
@keyframes inb{from{opacity:0;translate:0 30px}}
#genre{font-size:11px;letter-spacing:.2em;color:var(--g2);min-height:1.2em}
#title{font:600 clamp(13px,1.6vw,16px)/1.45 Manrope,system-ui,sans-serif;margin:6px 0 0;letter-spacing:0;max-width:64ch}
#desc{color:#b9b2a0;font-size:12px;line-height:1.5;max-width:46ch}
#play{position:relative;flex:none;border:0;min-height:40px;padding:10px 22px;font-weight:700;font-size:12px;letter-spacing:.1em;white-space:nowrap;color:#1a1204;background:var(--gold);background-size:220% 100%;box-shadow:0 0 22px #c9972b66,inset 0 -3px 5px #6b4a1299,inset 0 2px 2px #fff9;overflow:hidden;transition:background-position .9s var(--e),box-shadow .5s,transform .2s}
#play:hover:not(:disabled){background-position:100% 0;box-shadow:0 0 36px #f6e27aaa,inset 0 2px 2px #fff}
#bar{position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:3px;background:#ffffff14;overflow:hidden;opacity:0;transition:opacity .5s}#bar.on{opacity:1}
#bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 10px #f6e27a;transition:width .5s linear}#bar.fail i{background:#c0554a;box-shadow:0 0 10px #c0554a}
.hints{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;padding:7px;font-size:11px;color:#8a8472;border-top:1px solid #c9972b22}
.hints kbd{font:inherit;color:#eee;border:1px solid #c9972b66;border-radius:5px;padding:0 6px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);z-index:40;background:#000d;border:1px solid var(--g2);padding:8px 18px;border-radius:999px;font-size:12px;opacity:0;transition:all .5s var(--e);pointer-events:none;backdrop-filter:blur(8px);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#gameView{position:fixed;inset:0;z-index:35;display:none;background:#000}
#gameView.on{display:block}
#gameBack{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid #fff8;background:#05071399;color:#fff;border-radius:50%;font:600 22px/1 Manrope,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.72;touch-action:manipulation}
#gameBack:hover,#gameBack:focus-visible{opacity:1;background:#050713dd}
#gameFrame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#000}
#gameLoader{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(ellipse at 50% 46%,#30210c 0,#130d05 34%,#050403 78%);color:#f5eedc;text-align:center}
#gameLoader.on{display:flex}
#skullGlow{position:relative;width:min(150px,27vmin);aspect-ratio:1;display:grid;place-items:center;margin-bottom:4px;border:1px solid #f6e27a55;border-radius:50%;box-shadow:0 0 35px #c9972b33,inset 0 0 25px #c9972b22;animation:skullPulse 2.1s ease-in-out infinite}
#skullGlow::before,#skullGlow::after{content:"";position:absolute;inset:-9%;border:1px solid #c9972b55;border-radius:50%;transform:rotateX(68deg);animation:skullOrbit 3.8s linear infinite}
#skullGlow::after{inset:-18%;opacity:.45;transform:rotateX(68deg) rotateZ(60deg);animation-duration:6s;animation-direction:reverse}
#skull{width:61%;height:68%;filter:drop-shadow(0 0 14px #f6e27a99);animation:skullFloat 2.3s ease-in-out infinite}
@keyframes skullPulse{50%{box-shadow:0 0 55px #c9972b66,inset 0 0 36px #c9972b44}}
@keyframes skullOrbit{to{transform:rotateX(68deg) rotateZ(360deg)}}
@keyframes skullFloat{50%{transform:translateY(-5px)}}
#loadingBrand{font:700 11px Manrope,sans-serif;letter-spacing:.32em;color:#d8b75c}
#loadingTitle{font:700 clamp(20px,4vw,30px) Cinzel,Georgia,serif;letter-spacing:.12em;color:#fff3b0;text-shadow:0 0 18px #c9972b77}
#loadingMessage{min-height:1.4em;color:#b9b2a0;font-size:13px}
#loadingTrack{width:min(330px,72vw);height:4px;margin-top:5px;overflow:hidden;border-radius:99px;background:#ffffff18;box-shadow:0 0 10px #000}
#loadingFill{width:0;height:100%;border-radius:inherit;background:var(--gold);box-shadow:0 0 14px #f6e27a;transition:width .15s linear}
#loadingPercent{color:#b9a56a;font:11px ui-monospace,monospace;letter-spacing:.15em}
@media(prefers-reduced-motion:reduce){#skullGlow,#skullGlow::before,#skullGlow::after,#skull{animation:none!important}}
@media (max-height:430px){#desc{display:none}.top{padding:5px 14px}#info{padding:7px 14px;margin-bottom:5px}.hub{font-size:16px}}
@media (pointer:coarse){.hints{display:none}#gameBack{top:50%;left:max(8px,env(safe-area-inset-left));transform:translateY(-50%);opacity:.52}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
#term div{white-space:pre}#term .wr{color:#e3b04b}
.up small{opacity:.85;font-size:10px;line-height:1.5}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const lite=matchMedia('(pointer:coarse)').matches||innerWidth<900,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* Catálogo inicial: o jogo remoto só aparece na aba Jogos; não é aberto antes de entrar na Biblioteca. */
const CATALOG=[{title:'Drifin Slot',genre:'Corrida · Neon Drift',desc:'Corrida arcade em paisagem: faça drift nas curvas da Coast Highway, encadeie combos e use nitro para superar seu recorde.',img:'/games/drifin-slot-cover.jpg',url:'https://car-pend.vercel.app/',loadTime:{min:850,max:1450}},{title:'Corrida Lunar',genre:'Corrida · Arcade 3D',desc:'Dispute três voltas no Grande Prêmio Lunar: acelere, derrape, use nitro e itens para ultrapassar os rivais.',img:'/games/corrida-lunar-cover.jpg',url:'https://backrooms-flax.vercel.app/',loadTime:{min:1000,max:1800}}];
const GAMES=(window.NJ_GAMES&&window.NJ_GAMES.length)?window.NJ_GAMES:CATALOG;
const HUBS=['Jogos','Biblioteca','Sistema'];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hs=0,pos=0,drag=null,moved=false,busy=false,failed='',lib=store.get('nj_lib',[]),sound=true,ac,bus,master;
const inLib=g=>lib.includes(g.title);
const items=()=>{const a=hs===1?GAMES.filter(inLib):GAMES;return hs===2?[]:(a.length?a:[null])};
/* ÁUDIO: criado só após a primeira ação real do usuário; qualquer falha é ignorada */
function aInit(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;const cp=ac.createDynamicsCompressor();master.connect(cp).connect(ac.destination);
 const L=ac.sampleRate*2.2,b=ac.createBuffer(2,L,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
 const rv=ac.createConvolver();rv.buffer=b;const rg=ac.createGain();rg.gain.value=.3;rv.connect(rg).connect(master);bus=ac.createGain();bus.connect(master);bus.connect(rv)}
 if(ac.state==='suspended')ac.resume()}catch(e){ac=null}}
let bootSoundStarted=false;
function startBootSound(){const boot=$('boot'),audio=$('bootAudio');if(bootSoundStarted||!boot||boot.classList.contains('hide')||!audio)return;bootSoundStarted=true;audio.volume=.7;const p=audio.play();if(p&&p.catch)p.catch(()=>{bootSoundStarted=false})}
let tried=false;
function lockLandscape(){if(tried||!matchMedia('(pointer:coarse)').matches)return;tried=true;try{const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
function unlock(e){if(e&&e.isTrusted)startBootSound();aInit();if(e&&e.type!=='pointerdown')lockLandscape();if(!ac)return;if(ac.state!=='running')ac.resume().catch(()=>{})}
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
/* o console é horizontal: em tela vertical (toque), o palco gira 90° sozinho, sem aviso */
const mqP=matchMedia('(orientation:portrait)'),mqC=matchMedia('(pointer:coarse)');let rot=false;
function setRot(){rot=mqP.matches&&mqC.matches;document.documentElement.classList.toggle('rot',rot);layout();hubs()}
if(mqP.addEventListener)mqP.addEventListener('change',setRot);
const P=e=>rot?{x:e.clientY,y:innerWidth-e.clientX}:{x:e.clientX,y:e.clientY};
function tone(f,d,t,v,dl=0,at=.006){if(!ac||!sound||ac.state!=='running')return;try{const s=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(v,s+at);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(bus);o.start(s);o.stop(s+d+.05)}catch(e){}}
const ting=(f,v=.06,dl=0)=>[1,2,3].forEach((m,i)=>tone(f*m,1.4/(i+1),'sine',v/(i*1.5+1),dl));
const tick=()=>{tone(1760,.12,'sine',.03);tone(2640,.08,'sine',.012,.01)},sel=()=>{[659,988].forEach((f,i)=>ting(f,.07,i*.09));tone(165,.5,'sine',.1)};
/* menus verticais */
function hubs(){const n=$('hubs'),S=lite?46:68;if(!n.children.length)HUBS.forEach((h,i)=>{const b=document.createElement('button');b.className='hub';b.onclick=()=>setHub(i);n.appendChild(b)});
 [...n.children].forEach((b,i)=>{const d=i-hs;b.innerHTML=HUBS[i]+(i===1&&lib.length?`<sup>${lib.length}</sup>`:'');b.style.transform=`translateY(calc(-50% + ${d*S}px)) scale(${1-.3*Math.abs(d)})`;b.style.opacity=1-.55*Math.abs(d);b.classList.toggle('sel',d===0);b.setAttribute('aria-current',d===0)})}
function setHub(i){i=Math.min(Math.max(i,0),2);if(i===hs)return;hs=i;pos=0;tick();hubs();build();$('sys').classList.toggle('on',hs===2);$('info').style.opacity=hs===2?0:1;$('info').style.pointerEvents=hs===2?'none':''}
/* carrossel 3D */
const row=$('row');let TW=150,SP=120;
function layout(){const h=row.clientHeight*.62;TW=Math.max(Math.min(h*.75,row.clientWidth*(lite?.3:.22),280),84);SP=TW*(lite?.8:.88);row.style.setProperty('--tw',TW+'px');render()}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%40;return 30+h};
const disc='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 6"/><circle cx="50" cy="50" r="28" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/><circle cx="50" cy="50" r="4" fill="currentColor"/></svg>';
function build(){row.querySelectorAll('.tile').forEach(t=>t.remove());
 items().forEach((g,i)=>{const e=document.createElement('div');e.className='tile';e.tabIndex=0;e.dataset.i=i;let f;
  if(g===null){e.classList.add('empty');f=disc+(hs===1?'Sua biblioteca está vazia.<br>Adicione jogos pela aba Jogos.':'Nenhum jogo disponível.')}
  else{e.setAttribute('role','button');e.setAttribute('aria-label',g.title);f=(g.img?'':`<b class="ini">${g.title[0]}</b>`)+`<div class="cap">${g.title}</div>`+(hs===0&&inLib(g)?'<i class="bd">✓</i>':'')}
  e.innerHTML=`<div class="face" style="${g&&g.img?`background-image:url('${g.img}')`:g?`background-image:linear-gradient(160deg,hsl(${hue(g.title)} 45% 14%),#000)`:''}">${f}</div>`;
  if(!RM){e.style.opacity=0;e.style.transitionDelay=Math.abs(i-pos)*90+'ms';e.style.transform=`translate(-50%,-50%) translateX(${(i-pos)*SP+160}px) translateZ(-500px) rotateY(55deg) scale(.6)`}
  e.onclick=()=>{if(moved)return;i===Math.round(pos)?play():goTo(i)};
  e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();e.click()}};row.appendChild(e)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{layout();setTimeout(()=>row.querySelectorAll('.tile').forEach(t=>t.style.transitionDelay=''),1800)}))}
function render(){row.querySelectorAll('.tile').forEach(e=>{const d=+e.dataset.i-pos,a=Math.abs(d),f=Math.max(0,1-a),fo=a<.5;
 e.style.transform=`translate(-50%,-50%) translateX(${d*SP}px) translateZ(${f*110}px) rotateY(calc(${-d*(lite?16:26)}deg + ${fo?'var(--tx,0deg)':'0deg'})) rotateX(${fo?'var(--ty,0deg)':'0deg'}) scale(${.76+.28*f})`;
 e.style.filter=f>.95?'none':`blur(${lite?1:1.5+a*1.5}px) brightness(${.28+f*.72})`;e.style.opacity=Math.max(.25,f+.3);e.style.zIndex=Math.round(100-a*10);e.classList.toggle('focus',fo)});info()}
const cl=p=>Math.min(Math.max(p,0),Math.max(items().length-1,0));
function goTo(i){const n=cl(i);if(Math.round(n)!==Math.round(pos))tick();pos=n;render()}
const cur=()=>items()[Math.round(pos)];
function info(){const g=cur();if(!busy)$('genre').textContent=g?(g.title||''):'';$('title').textContent=g?(g.desc||''):(hs===1?'Biblioteca vazia':'Nenhum jogo disponível');
 $('desc').textContent=g?'':(hs===1?'Adicione jogos pela aba Jogos para vê-los aqui.':'');btn()}
function btn(){const g=cur(),b=$('play');let t='JOGAR',d=!g;
 if(g&&hs===0){t=inLib(g)?'NA BIBLIOTECA':'ENVIAR PARA BIBLIOTECA';d=inLib(g)}
 if(g&&hs===1){t='JOGAR';d=false}
 if(busy){t='ENVIANDO…';d=true}b.textContent=t;b.disabled=d}
function play(){const g=cur();if(!g||busy)return;if(hs===0){if(!inLib(g))addLib(g);return}
 if(hs===1&&inLib(g)){launchGame(g);return}sel();toast('Adicione o jogo à biblioteca para jogar.')}
let gameLoadSequence=0,gameLoadTimer=0,gameProgressTimer=0,gameFallbackTimer=0;
function launchGame(g){if(!g||!g.url)return;const seq=++gameLoadSequence,frame=$('gameFrame'),loader=$('gameLoader'),range=g.loadTime||{min:1700,max:3400},min=Math.max(400,+range.min||1700),max=Math.max(min,+range.max||3400),duration=Math.round(min+Math.random()*(max-min)),started=performance.now();let frameReady=false,delayReady=false;
 sel();frame.title=g.title;$('loadingTitle').textContent=g.title.toUpperCase();$('loadingMessage').textContent='Preparando o motor 3D…';$('loadingFill').style.width='0%';$('loadingPercent').textContent='0%';loader.classList.add('on');loader.setAttribute('aria-hidden','false');$('gameView').classList.add('on');$('gameView').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
 const finish=()=>{if(seq!==gameLoadSequence||!frameReady||!delayReady)return;clearTimeout(gameLoadTimer);clearInterval(gameProgressTimer);clearTimeout(gameFallbackTimer);$('loadingFill').style.width='100%';$('loadingPercent').textContent='100%';$('loadingMessage').textContent='Pista pronta';setTimeout(()=>{if(seq===gameLoadSequence){loader.classList.remove('on');loader.setAttribute('aria-hidden','true')}},180)};
 frame.onload=()=>{if(seq!==gameLoadSequence)return;frameReady=true;finish()};frame.src=g.url;
 gameProgressTimer=setInterval(()=>{if(seq!==gameLoadSequence)return;const p=Math.min(94,Math.floor((performance.now()-started)/duration*94));$('loadingFill').style.width=p+'%';$('loadingPercent').textContent=p+'%';$('loadingMessage').textContent=p<42?'Preparando o motor 3D…':p<78?'Carregando a pista…':'Finalizando a corrida…'},80);
 gameLoadTimer=setTimeout(()=>{delayReady=true;finish()},duration);gameFallbackTimer=setTimeout(()=>{if(seq!==gameLoadSequence||frameReady)return;frameReady=true;$('loadingMessage').textContent='Conexão lenta — abrindo o jogo…';finish()},15000)}
function closeGame(){gameLoadSequence++;clearTimeout(gameLoadTimer);clearInterval(gameProgressTimer);clearTimeout(gameFallbackTimer);const frame=$('gameFrame');frame.onload=null;frame.src='about:blank';$('gameLoader').classList.remove('on');$('gameLoader').setAttribute('aria-hidden','true');$('gameView').classList.remove('on');$('gameView').setAttribute('aria-hidden','true');document.body.style.overflow='';setHub(1);toast('De volta ao NJENGINE')}
$('gameBack').onclick=closeGame;
/* O envio salva o título na biblioteca local deste navegador; não depende de servidor externo. */
function addLib(g){busy=true;btn();tick();
 const MSG=['Preparando o jogo…','Adicionando à sua biblioteca…','Concluindo…'];
 const tile=row.querySelector('.tile.focus'),face=tile&&tile.querySelector('.face'),ov=document.createElement('div');ov.className='up';ov.innerHTML=disc+'<span></span>';if(face)face.appendChild(ov);
 const progressBar=$('bar'),fill=progressBar.firstChild;let p=0,n=0;progressBar.className='on';fill.style.width='0';
 const iv=setInterval(()=>{p=Math.min(100,p+22);fill.style.width=p+'%';const m=MSG[Math.min(2,Math.floor(p/36))];ov.lastChild.textContent=m+' '+Math.floor(p)+'%';$('genre').textContent=m;
  if(Math.floor(p/25)>n){n=Math.floor(p/25);tick()}
  if(p>=100){clearInterval(iv);setTimeout(done,250)}},100);
 function done(){fill.style.width='100%';if(!inLib(g))lib.push(g.title);store.set('nj_lib',lib);ov.className='up';ov.innerHTML='<span>✓ Adicionado</span>';sel();
   if(face)face.insertAdjacentHTML('beforeend','<i class="bd">✓</i>');fly(tile);
   setTimeout(()=>{ov.remove();progressBar.className='';busy=false;info();build();hubs()},800)}
}
/* o card voa em 3D até o menu Biblioteca */
function fly(tile){const hb=$('hubs').children[1];if(!tile||!hb||RM){hubs();toast('Adicionado à biblioteca');return}
 const loc=el=>{const r=el.getBoundingClientRect();return rot?{left:r.top,top:innerWidth-r.right,width:r.height,height:r.width}:r},a=loc(tile),b=loc(hb),c=tile.cloneNode(true);c.querySelectorAll('.up').forEach(x=>x.remove());
 Object.assign(c.style,{position:'fixed',left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px',margin:0,zIndex:80,pointerEvents:'none',transition:'none',filter:'none',opacity:1,animation:'none',transform:'none'});$('stage').appendChild(c);
 const dx=b.left+30-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
 c.animate([{transform:'perspective(800px)',opacity:1},{transform:`perspective(800px) translate(${dx}px,${dy}px) scale(.1) rotateY(540deg)`,opacity:.3}],{duration:1200,easing:'cubic-bezier(.6,0,.2,1)'}).onfinish=()=>{c.remove();hubs();hb.classList.add('pulse');setTimeout(()=>hb.classList.remove('pulse'),1000);toast('Adicionado à biblioteca')}}
/* arrastar com inércia + inclinação 3D leve do card em foco */
row.onpointerdown=e=>{const q=P(e);drag={x:q.x,y:q.y,l:q.x,v:0};moved=false;row.classList.add('dragging');row.setPointerCapture(e.pointerId)};
row.onpointermove=e=>{const r=row.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 if(!drag){const f=row.querySelector('.tile.focus');if(f&&!RM&&e.pointerType==='mouse'){f.style.setProperty('--tx',(px-.5)*10+'deg');f.style.setProperty('--ty',-(py-.5)*8+'deg');f.style.setProperty('--mx',px*100+'%');f.style.setProperty('--my',py*100+'%')}return}
 const q=P(e),dx=q.x-drag.l;drag.l=q.x;if(Math.abs(q.x-drag.x)>6)moved=true;const s=-dx/SP;drag.v=drag.v*.6+s*.4;pos=cl(pos+s);render()};
function end(e){if(!drag)return;const q=P(e),dy=q.y-drag.y,dx=q.x-drag.x,v=drag.v;drag=null;row.classList.remove('dragging');
 if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.5){moved=true;setHub(hs+(dy<0?1:-1));return}goTo(Math.round(cl(pos+v*5)))}
row.onpointerup=end;row.onpointercancel=end;
row.onpointerleave=()=>{const f=row.querySelector('.tile.focus');if(f){f.style.setProperty('--tx','0deg');f.style.setProperty('--ty','0deg')}};
let lw=0;row.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-lw<320)return;lw=n;goTo(Math.round(pos)+Math.sign(e.deltaX||e.deltaY))},{passive:false});
 addEventListener('keydown',e=>{if(!$('app').classList.contains('on'))return;const onCtl=e.target.closest&&e.target.closest('button,.tile');
 if($('gameView').classList.contains('on')){if(e.key==='Escape'){e.preventDefault();closeGame()}return}
 if(e.key==='ArrowDown')setHub(hs+1);else if(e.key==='ArrowUp')setHub(hs-1);else if(e.key==='ArrowRight')goTo(Math.round(pos)+1);else if(e.key==='ArrowLeft')goTo(Math.round(pos)-1);
 else if((e.key==='Enter'||e.key===' ')&&!onCtl){e.preventDefault();play()}});
$('play').onclick=play;
let tt;function toast(m,ms=2400){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms)}
function clk(){$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function conn(){const o=navigator.onLine;$('conn').innerHTML=`<i class="dot ${o?'':'off'}"></i>${o?'Online':'Offline'}`;$('sCon').textContent=o?'online':'offline'}
addEventListener('online',conn);addEventListener('offline',conn);
/* ABERTURA (~20 s): ponto de luz, linha de ouro, diagnóstico do sistema (50% de chance de erro simulado + recuperação), clarão e logo. O áudio só toca depois do primeiro toque/tecla. */
let ended=false;const wait=ms=>new Promise((res,rej)=>setTimeout(()=>ended?rej():res(),ms));
function reveal(){if(ended)return;ended=true;$('flash').style.opacity=1;setTimeout(()=>{$('flash').style.opacity=0;$('boot').classList.add('hide');$('app').classList.add('on');hubs();build();setTimeout(()=>$('boot').remove(),1500)},450)}
/* Os sons da abertura usam um arquivo original; os sintetizadores continuam reservados aos controles do menu. */
async function line(T,txt,st,cls,ms){const d=document.createElement('div');T.appendChild(d);d.textContent='['+(performance.now()/1000).toFixed(3).padStart(8)+'] ';requestAnimationFrame(()=>d.classList.add('on'));
 for(let i=0;i<txt.length;i++){d.textContent+=txt[i];await wait(30)}
 for(let i=0;i<6;i++){d.textContent+='.';await wait(70)}
 await wait(ms);const s=document.createElement('b');s.textContent=' '+st;s.className=cls;d.appendChild(s)}
async function intro(){const B=$('boot'),T=$('term'),D=$('dust');aInit();
 for(let i=0;i<36;i++){const e=document.createElement('i'),z=Math.random()*3+1;e.style.cssText=`left:${Math.random()*100}%;top:${40+Math.random()*60}%;width:${z}px;height:${z}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s`;D.appendChild(e)}
 try{await wait(500);B.classList.add('go');await wait(4200);
  await line(T,'NJ-CORE 1.0 boot','pronto','ok',300);
  await line(T,'Initializing graphics core','ok','ok',500);
  const bootFail=Math.random()<.35,which=Math.floor(Math.random()*2);
  if(bootFail&&which===0){const pc=40+Math.floor(Math.random()*45);await line(T,'Syncing library','falhou em '+pc+'% (E_TIMEOUT 0x80072EE2)','wr',900);await line(T,'Retrying sync (1/3)','ok','ok',1400)}
  else await line(T,'Syncing library','ok','ok',500);
  await line(T,'Checking memory','ok','ok',500);
  if(bootFail&&which===1){const pc=55+Math.floor(Math.random()*35);await line(T,'Optimizing renderer','aviso em '+pc+'% (shader cache 0xC0000185)','wr',900);await line(T,'Rebuilding shader cache','ok','ok',1500)}
  else await line(T,'Optimizing renderer','ok','ok',500);
  await wait(1000);B.classList.add('lit','open');await wait(2800);
  const rv=$('reveal');[...'NJENGINE'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;rv.appendChild(s);setTimeout(()=>s.classList.add('in'),i*260)});
  await wait(3400);rv.classList.add('sh');$('sub').classList.add('in');await wait(5200);reveal()}catch(e){}}
addEventListener('resize',setRot);
setRot();clk();setInterval(clk,15000);conn();intro();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
