<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NJENGINE">
  <meta name="description" content="NJENGINE — sua biblioteca pessoal de jogos.">
  <title>NJENGINE</title>
  <link rel="manifest" href="/__grok/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/__grok/icon-180.png">
  <link rel="apple-touch-icon" href="/__grok/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

:root{--gold:linear-gradient(100deg,#6b4a12 0%,#c9972b 16%,#fff3b0 36%,#d4a437 52%,#8a6114 68%,#f6e27a 86%,#a87a1e 100%);--g1:#f6e27a;--g2:#c9972b;--g3:#6b4a12;--e:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2efe8;font:400 14px Manrope,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.cz,.logo,.hub,#title,.cap,#reveal,#play{font-family:Cinzel,Georgia,serif}
.gt{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 60% 40%,transparent 30%,#000e 100%)}
#rotate{position:fixed;inset:0;z-index:90;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:600 12px Manrope;color:var(--g2);letter-spacing:.2em;text-align:center}
#rotate i{width:32px;height:56px;border:2px solid var(--g1);border-radius:8px;box-shadow:0 0 16px #c9972b99;animation:rot 2.4s var(--e) infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
/* ABERTURA */
#boot{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;transition:opacity 1.2s var(--e)}
#boot.hide{opacity:0;pointer-events:none}
#press{position:absolute;bottom:16%;font:12px Manrope;letter-spacing:.4em;color:var(--g2);cursor:pointer;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
#rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax;background:repeating-conic-gradient(from 0deg,#f6e27a00 0 8deg,#f6e27a14 9deg 10deg,#f6e27a00 11deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);opacity:0;transition:opacity 2.5s}
#boot.lit #rays{opacity:1;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#line{position:absolute;left:10%;right:10%;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,#fff3b0,#f6e27a,#fff3b0,transparent);box-shadow:0 0 24px #f6e27a,0 0 70px #c9972b;transform:scaleX(0);opacity:0}
#boot.go #line{animation:ln 7s var(--e) forwards}
@keyframes ln{0%{transform:scaleX(0);opacity:1;height:2px}55%{transform:scaleX(1);opacity:1;height:2px}80%{transform:scaleX(1);opacity:1;height:60vh;margin-top:-30vh}100%{transform:scaleX(1);opacity:0;height:90vh;margin-top:-45vh}}
#bloom{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,#f6e27a55,#c9972b22 35%,transparent 65%);opacity:0;transform:scale(.3);transition:all 5s var(--e)}
#boot.lit #bloom{opacity:1;transform:scale(1)}
#stg{position:relative;perspective:900px;text-align:center}
#reveal{display:flex;justify-content:center;font-weight:900;font-size:clamp(34px,10vw,104px);letter-spacing:.06em;-webkit-box-reflect:below -4px linear-gradient(transparent 55%,#0007)}
#reveal span{display:inline-block;opacity:0;transform:translateZ(-300px) rotateX(80deg) scale(1.5);filter:blur(14px);transition:all 1.9s var(--e);background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#reveal span.in{opacity:1;transform:none;filter:none}
#reveal.sh span{animation:shn 2.6s ease-in-out infinite}
@keyframes shn{0%{background-position:100% 0}100%{background-position:0 0}}
#sub{margin-top:10px;font:600 clamp(9px,1.6vw,13px) Manrope;letter-spacing:.5em;color:#d9d3c2;opacity:0;transition:opacity 2s}
#sub.in{opacity:1}
#msgs{position:absolute;left:22px;bottom:18px;font:11px/1.9 ui-monospace,monospace;color:#8d7a4a}
#msgs div{opacity:0;transform:translateX(-6px);transition:all .6s var(--e)}#msgs div.on{opacity:1;transform:none}#msgs div.ok::after{content:" ok";color:var(--g1)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:60;pointer-events:none;transition:opacity .45s ease-in}
/* APP */
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;opacity:0;transition:opacity 1.8s var(--e)}#app.on{opacity:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;border-bottom:1px solid #c9972b33;background:linear-gradient(#000c,transparent);backdrop-filter:blur(10px)}
.logo{font-size:17px;font-weight:900;letter-spacing:.14em}
.st{display:flex;gap:14px;align-items:center;font-size:12px;color:#b9b2a0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g1);box-shadow:0 0 8px var(--g1);margin-right:6px}.dot.off{background:#d55;box-shadow:0 0 8px #d55}
button{font:inherit;color:inherit;background:none;border:1px solid #c9972b66;border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .4s var(--e)}
button:hover{border-color:var(--g1)}
button:focus-visible,.tile:focus-visible{outline:none;box-shadow:0 0 0 2px var(--g1),0 0 24px #f6e27a88}
button:disabled{opacity:.35;cursor:default}

#main{flex:1;display:flex;min-height:0}
#hubs{position:relative;width:clamp(150px,25%,290px);flex:none;overflow:hidden}
#hubs::after{content:"";position:absolute;left:0;top:50%;width:3px;height:38px;transform:translateY(-50%);background:var(--gold);box-shadow:0 0 16px #f6e27a}
.hub{position:absolute;left:22px;top:50%;font-weight:700;font-size:clamp(17px,3vw,31px);letter-spacing:.1em;white-space:nowrap;cursor:pointer;border:0;border-radius:0;padding:0;transition:all .9s var(--e);transform-origin:left center;color:#fff}
.hub.sel{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px #c9972b88)}
#right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#row{flex:1;position:relative;perspective:1300px;overflow:hidden;touch-action:none;cursor:grab;min-height:0}
#row.dragging{cursor:grabbing}#row.dragging .tile{transition:none}
.tile{position:absolute;left:50%;top:46%;width:var(--tw,180px);aspect-ratio:3/4;border-radius:12px;padding:3px;background:linear-gradient(135deg,#6b4a12,#f6e27a 30%,#8a6114 55%,#fff3b0 75%,#a87a1e);box-shadow:0 30px 60px #000,0 0 0 1px #000;transition:transform 1s var(--e),filter 1s var(--e),opacity 1s var(--e);will-change:transform;cursor:pointer;-webkit-box-reflect:below 3px linear-gradient(transparent 66%,#0008)}
.face{position:absolute;inset:3px;border-radius:9px;overflow:hidden;background:center/cover no-repeat}
.face::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff26,transparent 40%);z-index:2}
.face::after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(circle at var(--mx,30%) var(--my,15%),#fff9,transparent 45%);mix-blend-mode:soft-light;opacity:0;transition:opacity .8s}
.tile.focus .face::after{opacity:1}
.tile.focus{box-shadow:0 0 60px #c9972b77,0 30px 60px #000}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(40px,9vw,90px) Cinzel;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.85}
.cap{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 9px;background:linear-gradient(transparent,#000f);font-size:11px;font-weight:700;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.empty .face{background:radial-gradient(circle at 50% 38%,#1b1508,#030303);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#b9a56a;font-size:11px;line-height:1.55;padding:10px;gap:9px}
.empty svg{width:46%;color:var(--g1);filter:drop-shadow(0 0 8px #c9972b);animation:sp 16s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bd{position:absolute;top:8px;right:8px;z-index:4;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1204;font:700 12px/22px Manrope;text-align:center;font-style:normal;box-shadow:0 0 12px #c9972b}




#sys{position:absolute;inset:0;display:none;align-items:center;justify-content:center}#sys.on{display:flex}
.box{width:min(420px,88%);padding:20px;border-radius:14px;background:linear-gradient(#ffffff14,#ffffff05);border:1px solid #c9972b55;backdrop-filter:blur(14px);line-height:1.7;font-size:13px;color:#cfc8b6}
.box h3{font:700 15px Cinzel;letter-spacing:.15em;margin-bottom:10px}.box p{margin-bottom:8px}
#info{position:relative;margin:0 16px 8px 8px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#ffffff16,#ffffff05);border:1px solid #c9972b55;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:14px;transition:opacity .6s}
#genre{font-size:11px;letter-spacing:.2em;color:var(--g2)}
#title{font-size:clamp(15px,2.6vw,26px);font-weight:700;margin:3px 0;letter-spacing:.08em}
#desc{color:#b9b2a0;font-size:12px;line-height:1.5;max-width:46ch}
#play{position:relative;flex:none;border:0;padding:10px 22px;font-weight:700;font-size:12px;letter-spacing:.1em;white-space:nowrap;color:#1a1204;background:var(--gold);background-size:220% 100%;box-shadow:0 0 22px #c9972b66,inset 0 -3px 5px #6b4a1299,inset 0 2px 2px #fff9;overflow:hidden;transition:background-position .9s var(--e),box-shadow .5s}
#play:hover:not(:disabled){background-position:100% 0;box-shadow:0 0 36px #f6e27aaa,inset 0 2px 2px #fff}
.hints{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;padding:7px;font-size:11px;color:#8a8472;border-top:1px solid #c9972b22}
.hints kbd{font:inherit;color:#eee;border:1px solid #c9972b66;border-radius:5px;padding:0 6px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);z-index:40;background:#000c;border:1px solid var(--g2);padding:8px 18px;border-radius:999px;font-size:12px;opacity:0;transition:all .5s var(--e);pointer-events:none;backdrop-filter:blur(8px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:430px){#desc{display:none}.top{padding:5px 14px}.hints{padding:4px;font-size:10px}#info{padding:7px 14px;margin-bottom:5px}.hub{font-size:16px}}
@media (prefers-reduced-motion:reduce){#rays,#reveal.sh span{animation:none!important}}


/* Instalación PWA. */
#press { border: 0; border-radius: 0; padding: 0; background: transparent; color: var(--g2); }
#install { border-color: #c9972b88; color: var(--g1); font-size: 10px; letter-spacing: .12em; white-space: nowrap; }
#install.available { color: #1a1204; background: var(--gold); box-shadow: 0 0 14px #c9972b77; }
#sys .box { width: min(440px, 90%); }
#sys .box p { margin-bottom: 8px; }
.system-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.system-actions button { min-height: 38px; }
#row { touch-action: none; }
.tile { border: 0; color: inherit; padding: 3px; }
.face img { display: block; width: 100%; height: 100%; object-fit: cover; }
.disc { position: relative; display: grid; width: 46%; aspect-ratio: 1; place-items: center; border: 1px dashed var(--g1); border-radius: 50%; color: var(--g1); filter: drop-shadow(0 0 8px #c9972b); animation: sp 16s linear infinite; }
.disc::before { position: absolute; inset: 16%; border: 1px solid #f6e27a88; border-radius: 50%; content: ""; }
.disc i { width: 11%; aspect-ratio: 1; border: 1px solid var(--g1); border-radius: 50%; background: #c9972b55; }
.empty-label { color: var(--g1); font: 700 12px Cinzel, Georgia, serif; letter-spacing: .14em; }
.empty-status { color: #9f9069; font-size: 9px; letter-spacing: .25em; }
.copy { min-width: 0; }
#desc { margin-top: 0; }
#play { min-width: 126px; min-height: 42px; padding: 9px 20px; white-space: nowrap; }
#play:disabled { opacity: .4; cursor: default; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) { .disc { animation: none !important; } }

  </style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas><div class="vg" aria-hidden="true"></div>
<div id="rotate" role="status" aria-label="Gire o celular para continuar"><i aria-hidden="true"></i>GIRE O CELULAR<br>PARA O MODO PAISAGEM</div>
<section id="boot" aria-label="Abertura NJENGINE"><div id="rays"></div><div id="bloom"></div><div id="line"></div>
  <div id="stg"><div id="reveal" aria-label="NJENGINE"></div><div id="sub">INTERACTIVE ENTERTAINMENT SYSTEM</div></div>
  <button id="press" type="button">TOQUE PARA LIGAR</button><div id="msgs" aria-hidden="true"></div>
</section>
<div id="flash" aria-hidden="true"></div>
<div id="app">
  <header class="top"><div class="logo gt">NJENGINE</div>
    <div class="st"><span id="clock"></span><span id="conn"></span><button id="install" type="button" aria-label="Instalar NJENGINE">INSTALAR</button></div>
  </header>
  <div id="main"><nav id="hubs" aria-label="Menus NJENGINE"></nav>
    <section id="right">
      <div id="row" aria-label="Carrossel de jogos">
        <div id="sys"><div class="box">
          <h3 class="gt">Sistema</h3>
          <p>NJENGINE — interface de console.</p>
          <p>Conexão: <span id="sCon">—</span></p>
          <p>Biblioteca: <span id="game-count">0 de 12 jogos</span></p>
          <p>Os jogos ficam salvos neste navegador.</p>
          <div class="system-actions"><button id="sound" type="button">Som ligado</button><button id="install-system" type="button">Instalar / ajuda</button></div>
        </div></div>
      </div>
      <div id="info"><div class="copy"><div id="genre"></div><h2 id="title"></h2><p id="desc"></p></div><button id="play" type="button" disabled>JOGAR</button></div>
    </section>
  </div>
  <footer class="hints" id="hints"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const STORAGE_KEY = "njengines.bays.v1";
const HUBS = ["Jogos", "Biblioteca", "Sistema"];
const BOOT_WORD = "NJENGINE";
const BOOT_MESSAGES = ["Initializing graphics core", "Syncing library", "Preparing game environment", "Optimizing renderer"];
const emptySlot = (index) => {
  const bay = String(index + 1).padStart(2, "0");
  return { id: `bay-${bay}`, bay, title: "", description: "", genre: "", platform: "", year: "", playUrl: "", videoUrl: "", imageUrl: "" };
};
const cleanUrl = (value) => {
  const text = typeof value === "string" ? value.trim() : "";
  if (!text) return "";
  try {
    const url = new URL(text);
    return url.protocol === "https:" || url.protocol === "http:" ? url.toString() : "";
  } catch { return ""; }
};
const sanitize = (input, base) => ({
  ...base,
  title: String(input.title || "").slice(0, 48).trim(),
  description: String(input.description || "").slice(0, 480).trim(),
  genre: String(input.genre || "").slice(0, 28).trim(),
  platform: String(input.platform || "").slice(0, 28).trim(),
  year: String(input.year || "").replace(/[^\d]/g, "").slice(0, 4),
  playUrl: cleanUrl(input.playUrl).slice(0, 500),
  videoUrl: cleanUrl(input.videoUrl).slice(0, 500),
  imageUrl: typeof input.imageUrl === "string" && input.imageUrl.startsWith("data:image/") ? input.imageUrl.slice(0, 2_400_000) : "",
});
const filled = (slot) => Boolean(slot && (slot.title || slot.imageUrl || slot.playUrl || slot.videoUrl || slot.description));
const makeEmptySlots = () => Array.from({ length: 12 }, (_, index) => emptySlot(index));
function loadSlots() {
  const base = makeEmptySlots();
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!Array.isArray(stored)) return base;
    for (const item of stored) {
      if (!item || typeof item !== "object" || typeof item.id !== "string") continue;
      const index = base.findIndex((slot) => slot.id === item.id);
      if (index !== -1) base[index] = sanitize(item, base[index]);
    }
  } catch { /* A corrupted or unavailable browser store opens as empty. */ }
  return base;
}
let slots = loadSlots();
let hub = 0;
let position = 0;
let cardWidth = 150;
let spacing = 120;
let lite = false;
let drag = null;
let moved = false;
let suppressCardClick = false;
let bootStarted = false;
let muted = false;
let audioContext = null;
let masterGain = null;
let audioBus = null;
let deferredInstallPrompt = null;
let toastTimer = 0;
let particles = [];
let canvasWidth = 0;
let canvasHeight = 0;
let canvasContext = null;
let animationFrame = 0;
const canvas = $("fx");
const row = $("row");

function savedGames() { return slots.filter(filled); }
function firstFree() { return slots.find((slot) => !filled(slot)) || null; }
function items() {
  if (hub === 0) return slots;
  if (hub === 1) return savedGames().length ? savedGames() : [null];
  return [];
}
function currentIndex() { return Math.max(0, Math.min(Math.round(position), items().length - 1)); }
function currentSlot() {
  const item = items()[currentIndex()];
  return item || (hub === 2 ? null : firstFree());
}
function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("on");
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => node.classList.remove("on"), 2600);
}
function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }
function titleHash(text) {
  let hash = 0;
  for (const character of text) hash = (hash * 31 + character.charCodeAt(0)) % 40;
  return 30 + hash;
}
function createDisc() {
  const disc = document.createElement("span");
  disc.className = "disc";
  const inner = document.createElement("i");
  disc.append(inner);
  return disc;
}
function createEmptyFace(label, status) {
  const art = document.createElement("span");
  art.className = "empty-art";
  art.append(createDisc());
  const main = document.createElement("span");
  main.className = "empty-label";
  main.textContent = label;
  const sub = document.createElement("span");
  sub.className = "empty-status";
  sub.textContent = status;
  art.append(main, sub);
  return art;
}
function buildCard(item, index) {
  const slot = item || firstFree();
  if (!slot) return null;
  const isLibraryEmpty = hub === 1 && item === null;
  const hasGame = filled(slot);
  const card = document.createElement("button");
  card.type = "button";
  card.className = `tile${hasGame ? "" : " empty"}`;
  card.dataset.index = String(index);
  card.setAttribute("aria-pressed", "false");
  card.setAttribute("aria-label", isLibraryEmpty ? "Biblioteca vazia." : hasGame ? `${slot.title || "Jogo"}, selecionar` : `Baia ${slot.bay}, espaço livre, selecionar`);
  const face = document.createElement("span");
  face.className = "face";
  if (hasGame) {
    if (slot.imageUrl) {
      const image = document.createElement("img");
      image.alt = "";
      image.draggable = false;
      image.src = slot.imageUrl;
      face.append(image);
    } else {
      face.style.background = `linear-gradient(155deg,hsl(${titleHash(slot.title || slot.bay)} 40% 16%),#050505 78%)`;
      const initial = document.createElement("span");
      initial.className = "ini";
      initial.textContent = (slot.title || "NJ").trim().slice(0, 1).toUpperCase();
      face.append(initial);
    }
    const caption = document.createElement("span");
    caption.className = "cap";
    caption.textContent = slot.title || `Baia ${slot.bay}`;
    face.append(caption);
    if (hub === 0) {
      const badge = document.createElement("i");
      badge.className = "bd";
      badge.setAttribute("aria-label", "Cadastrado na biblioteca");
      badge.textContent = "✓";
      face.append(badge);
    }
  } else {
    face.append(createEmptyFace(isLibraryEmpty ? "BIBLIOTECA" : `BAIA ${slot.bay}`, isLibraryEmpty ? "VAZIA" : "LIVRE"));
  }
  card.append(face);
  card.addEventListener("click", () => {
    if (suppressCardClick) return;
    if (index !== currentIndex()) {
      position = index;
      playTick();
      renderPosition();
      return;
    }
    activateSlot(slot);
  });
  card.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      card.click();
    }
  });
  return card;
}
function layout() {
  const width = row.clientWidth || window.innerWidth;
  const height = row.clientHeight || window.innerHeight;
  lite = window.matchMedia("(pointer:coarse)").matches || window.innerWidth < 900;
  cardWidth = Math.max(Math.min(height * 0.62 * 0.75, width * (lite ? 0.3 : 0.22), 280), 84);
  spacing = cardWidth * (lite ? 0.8 : 0.88);
  row.style.setProperty("--tw", `${cardWidth}px`);
  renderPosition();
  renderHubs();
}
function renderHubs() {
  const nav = $("hubs");
  if (!nav.children.length) {
    HUBS.forEach((name, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hub";
      button.textContent = name;
      button.addEventListener("click", () => setHub(index - hub));
      nav.append(button);
    });
  }
  [...nav.children].forEach((button, index) => {
    const distance = index - hub;
    button.style.transform = `translateY(calc(-50% + ${distance * (lite ? 46 : 68)}px)) scale(${1 - 0.3 * Math.abs(distance)})`;
    button.style.opacity = String(Math.max(0.12, 1 - 0.55 * Math.abs(distance)));
    button.classList.toggle("sel", distance === 0);
    button.setAttribute("aria-current", distance === 0 ? "page" : "false");
  });
}
function renderCards() {
  row.querySelectorAll(".tile").forEach((card) => card.remove());
  items().forEach((item, index) => {
    const card = buildCard(item, index);
    if (card) row.append(card);
  });
  renderPosition();
}
function renderPosition() {
  const max = Math.max(0, items().length - 1);
  position = clamp(position, 0, max);
  row.querySelectorAll(".tile").forEach((card) => {
    const delta = Number(card.dataset.index) - position;
    const distance = Math.abs(delta);
    const focus = distance < 0.5;
    const blend = Math.max(0, 1 - distance);
    const phone = lite;
    card.style.transform = `translate(-50%,-50%) translateX(${delta * spacing}px) translateZ(${blend * 100}px) rotateY(${-delta * (phone ? 16 : 26) + (focus ? pointerTilt.x : 0)}deg) rotateX(${focus ? pointerTilt.y : 0}deg) scale(${0.76 + 0.28 * blend})`;
    card.style.filter = blend > 0.95 ? "none" : `blur(${phone ? 1 : 1.5 + distance * 1.5}px) brightness(${0.28 + blend * 0.72})`;
    card.style.opacity = String(Math.max(0.25, blend + 0.3));
    card.style.zIndex = String(Math.round(100 - distance * 10));
    card.classList.toggle("focus", focus);
    card.setAttribute("aria-pressed", focus ? "true" : "false");
    const face = card.querySelector(".face");
    if (face) {
      face.style.setProperty("--mx", `${pointerLight.x}%`);
      face.style.setProperty("--my", `${pointerLight.y}%`);
    }
  });
  updateInfo();
}
let pointerTilt = { x: 0, y: 0 };
let pointerLight = { x: 30, y: 15 };
function updateInfo() {
  const info = $("info");
  const system = $("sys");
  const showSystem = hub === 2;
  system.classList.toggle("on", showSystem);
  info.style.opacity = showSystem ? "0" : "1";
  info.style.pointerEvents = showSystem ? "none" : "auto";
  $("game-count").textContent = `${savedGames().length} de ${slots.length} jogos`;
  $("sCon").textContent = navigator.onLine ? "online" : "offline";
  if (showSystem) return;
  const isLibraryEmpty = hub === 1 && savedGames().length === 0;
  const slot = currentSlot();
  const hasGame = Boolean(slot && filled(slot));
  $("genre").textContent = isLibraryEmpty ? "BIBLIOTECA VAZIA" : hasGame ? slot.genre || slot.platform || "JOGO DA BIBLIOTECA" : slot ? `BAIA ${slot.bay} · ESPAÇO LIVRE` : "SEM JOGOS DISPONÍVEIS";
  $("title").textContent = isLibraryEmpty ? "Biblioteca vazia" : hasGame ? slot.title || `Baia ${slot.bay}` : slot ? `Baia ${slot.bay} · livre` : "Nenhum jogo disponível";
  $("desc").textContent = isLibraryEmpty ? "Ainda não há jogos nesta biblioteca." : hasGame ? slot.description || [slot.genre, slot.platform, slot.year].filter(Boolean).join(" · ") || "Jogo cadastrado nesta biblioteca." : slot ? "Espaço reservado para um jogo futuro." : "Os jogos aparecerão aqui em breve.";
  const play = $("play");
  play.disabled = !(hasGame && cleanUrl(slot.playUrl));
  play.textContent = "JOGAR";
}
function setHub(direction) {
  const next = clamp(hub + direction, 0, 2);
  if (next === hub) return;
  hub = next;
  position = 0;
  playTick();
  renderHubs();
  renderCards();
}
function moveCard(direction) {
  const list = items();
  if (!list.length) return;
  const next = clamp(Math.round(position) + (direction > 0 ? 1 : -1), 0, list.length - 1);
  if (next === Math.round(position)) return;
  position = next;
  playTick();
  renderPosition();
}
function activateSlot(slot) {
  if (!slot || !filled(slot)) return;
  const href = cleanUrl(slot.playUrl);
  if (!href) return;
  window.open(href, "_blank", "noopener,noreferrer");
  playSelection();
}
function activateCurrent() {
  if (hub === 2) { toggleMute(); return; }
  activateSlot(currentSlot());
}
function pointerDown(event) {
  if (event.target.closest("#sys")) return;
  drag = { x: event.clientX, y: event.clientY, lastX: event.clientX, start: position, velocity: 0 };
  moved = false;
  row.setPointerCapture(event.pointerId);
}
function pointerMove(event) {
  if (!drag) {
    if (event.pointerType === "mouse" && !lite) {
      const rect = row.getBoundingClientRect();
      pointerTilt = { x: ((event.clientX - rect.left) / rect.width - 0.5) * 10, y: -((event.clientY - rect.top) / rect.height - 0.5) * 8 };
      pointerLight = { x: ((event.clientX - rect.left) / rect.width) * 100, y: ((event.clientY - rect.top) / rect.height) * 100 };
      renderPosition();
    }
    return;
  }
  const dx = event.clientX - drag.lastX;
  drag.lastX = event.clientX;
  if (Math.abs(event.clientX - drag.x) > 6 || Math.abs(event.clientY - drag.y) > 6) moved = true;
  const change = -dx / Math.max(spacing, 1);
  drag.velocity = drag.velocity * 0.6 + change * 0.4;
  position = clamp(position + change, 0, Math.max(0, items().length - 1));
  renderPosition();
}
function pointerUp(event) {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  const velocity = drag.velocity;
  drag = null;
  if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5) {
    moved = true;
    suppressClick();
    setHub(dy < 0 ? 1 : -1);
  } else if (moved) {
    position = clamp(Math.round(position + velocity * 5), 0, Math.max(0, items().length - 1));
    suppressClick();
    playTick();
    renderPosition();
  }
  pointerTilt = { x: 0, y: 0 };
  moved = false;
}
function suppressClick() {
  suppressCardClick = true;
  window.setTimeout(() => { suppressCardClick = false; }, 350);
}
let lastWheel = 0;
function pointerWheel(event) {
  event.preventDefault();
  const now = performance.now();
  if (now - lastWheel < 300) return;
  lastWheel = now;
  moveCard(Math.sign(Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY));
}

function ensureAudio() {
  if (audioContext) return audioContext;
  const Constructor = window.AudioContext || window.webkitAudioContext;
  if (!Constructor) return null;
  try {
    audioContext = new Constructor();
    masterGain = audioContext.createGain();
    masterGain.gain.value = muted ? 0 : 0.7;
    const compressor = audioContext.createDynamicsCompressor();
    masterGain.connect(compressor).connect(audioContext.destination);
    const length = audioContext.sampleRate * 2.8;
    const impulse = audioContext.createBuffer(2, length, audioContext.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const samples = impulse.getChannelData(channel);
      for (let index = 0; index < length; index++) samples[index] = (Math.random() * 2 - 1) * Math.pow(1 - index / length, 3);
    }
    const reverb = audioContext.createConvolver();
    reverb.buffer = impulse;
    const reverbGain = audioContext.createGain();
    reverbGain.gain.value = 0.35;
    reverb.connect(reverbGain).connect(masterGain);
    audioBus = audioContext.createGain();
    audioBus.connect(masterGain);
    audioBus.connect(reverb);
    return audioContext;
  } catch { return null; }
}
function tone(frequency, duration, type, volume, delay = 0, glide = 1, attack = 0.01) {
  if (!audioContext || !audioBus || muted) return;
  try {
    const start = audioContext.currentTime + delay;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (glide !== 1) oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, frequency * glide), start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(volume, start + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain).connect(audioBus);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.05);
  } catch { /* Audio is optional; controls continue without it. */ }
}
function chime(frequency, volume = 0.06, delay = 0) {
  [1, 2, 3].forEach((multiple, index) => tone(frequency * multiple, 1.5 / (index + 1), "sine", volume / (index * 1.5 + 1), delay, 1, 0.006));
}
function bootSound() {
  [73.4, 110, 146.8, 185, 220, 329.6].forEach((frequency, index) => {
    tone(frequency, 15, "sine", 0.07, index * 0.4, 1, 6);
    tone(frequency * 1.004, 15, "triangle", 0.025, index * 0.4, 1, 7);
  });
  [587, 740, 880, 1109, 1319].forEach((frequency, index) => chime(frequency, 0.05, 9 + index * 0.5));
  window.setTimeout(() => {
    tone(73.4, 5, "sine", 0.3, 0, 1, 0.05);
    [880, 1319, 1760].forEach((frequency, index) => chime(frequency, 0.08, index * 0.12));
  }, 12_200);
}
function playTick() {
  if (muted) return;
  tone(1760, 0.14, "sine", 0.035);
  tone(2640, 0.09, "sine", 0.015, 0.01);
}
function playSelection() {
  if (muted) return;
  [659, 988].forEach((frequency, index) => chime(frequency, 0.07, index * 0.09));
  tone(165, 0.6, "sine", 0.1);
}
function toggleMute() {
  muted = !muted;
  if (audioContext && masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.7, audioContext.currentTime, 0.05);
  $("sound").textContent = muted ? "Som desligado" : "Som ligado";
}
function startBoot() {
  if (bootStarted || window.matchMedia("(orientation:portrait) and (pointer:coarse)").matches) return;
  bootStarted = true;
  const context = ensureAudio();
  if (context && context.state === "suspended") context.resume().catch(() => {});
  bootSound();
  $("press").remove();
  $("boot").classList.add("go");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) {
    $("boot").classList.add("lit");
    revealWord();
    $("sub").classList.add("in");
    window.setTimeout(() => { $("flash").style.opacity = "1"; }, 650);
    window.setTimeout(() => { $("flash").style.opacity = "0"; $("boot").classList.add("hide"); $("app").classList.add("on"); layout(); }, 1_050);
    return;
  }
  window.setTimeout(() => $("boot").classList.add("lit"), 5_000);
  BOOT_MESSAGES.forEach((message, index) => window.setTimeout(() => {
    const line = document.createElement("div");
    line.textContent = message;
    $("msgs").append(line);
    requestAnimationFrame(() => line.classList.add("on"));
    window.setTimeout(() => line.classList.add("ok"), 1_000);
    playTick();
  }, 5_500 + index * 1_500));
  window.setTimeout(revealWord, 12_200);
  window.setTimeout(() => $("reveal").classList.add("sh"), 15_500);
  window.setTimeout(() => $("sub").classList.add("in"), 15_000);
  window.setTimeout(() => { playSelection(); $("flash").style.opacity = "1"; }, 19_500);
  window.setTimeout(() => { $("flash").style.opacity = "0"; }, 20_000);
  window.setTimeout(() => { $("boot").classList.add("hide"); $("app").classList.add("on"); layout(); }, 20_300);
}
function revealWord() {
  const reveal = $("reveal");
  [...BOOT_WORD].forEach((letter, index) => {
    const span = document.createElement("span");
    span.textContent = letter;
    reveal.append(span);
    window.setTimeout(() => span.classList.add("in"), index * 260);
  });
}

function updateClock() {
  $("clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function updateConnection() {
  const online = navigator.onLine;
  $("conn").replaceChildren();
  const dot = document.createElement("i");
  dot.className = `dot${online ? "" : " off"}`;
  $("conn").append(dot, document.createTextNode(online ? "Online" : "Offline"));
  $("sCon").textContent = online ? "online" : "offline";
}
function installHelp() {
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (standalone) { toast("NJENGINE já está instalado neste aparelho."); return; }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then((choice) => {
      if (choice.outcome === "accepted") toast("Instalação do NJENGINE iniciada.");
      deferredInstallPrompt = null;
    }).catch(() => { deferredInstallPrompt = null; });
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(ios ? "No Safari: Compartilhar → Adicionar à Tela de Início." : "Abra o menu do navegador e escolha Instalar app ou Adicionar à tela inicial.");
}
function resizeCanvas() {
  if (!canvasContext) return;
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvasWidth = window.innerWidth;
  canvasHeight = window.innerHeight;
  canvas.width = Math.round(canvasWidth * ratio);
  canvas.height = Math.round(canvasHeight * ratio);
  canvasContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  particles = Array.from({ length: lite ? 28 : 90 }, () => ({ x: Math.random() * canvasWidth, y: Math.random() * canvasHeight, r: Math.random() * 2.2 + 0.4, v: Math.random() * 0.3 + 0.05, p: Math.random() * 6 }));
}
function drawBackground(time) {
  if (!canvasContext) return;
  const context = canvasContext;
  const seconds = time / 1000;
  context.globalCompositeOperation = "source-over";
  context.fillStyle = "#000";
  context.fillRect(0, 0, canvasWidth, canvasHeight);
  const glow = context.createRadialGradient(canvasWidth * 0.62, canvasHeight * 0.1, 0, canvasWidth * 0.62, canvasHeight * 0.1, canvasHeight * 1.1);
  glow.addColorStop(0, "#2a1f0a"); glow.addColorStop(0.5, "#0b0904"); glow.addColorStop(1, "#000");
  context.fillStyle = glow; context.fillRect(0, 0, canvasWidth, canvasHeight);
  context.globalCompositeOperation = "lighter";
  for (let index = 0; index < (lite ? 2 : 4); index++) {
    context.save();
    context.translate(canvasWidth * (0.35 + index * 0.17), -20);
    context.rotate(0.35 + Math.sin(seconds * 0.15 + index) * 0.08);
    const beam = context.createLinearGradient(0, 0, 0, canvasHeight * 1.3);
    beam.addColorStop(0, "rgba(246,226,122,.09)"); beam.addColorStop(1, "rgba(246,226,122,0)");
    context.fillStyle = beam; context.fillRect(-canvasWidth * 0.04, 0, canvasWidth * 0.08, canvasHeight * 1.3);
    context.restore();
  }
  context.fillStyle = "#f6e27a";
  for (const particle of particles) {
    particle.y -= particle.v;
    particle.x += Math.sin(seconds + particle.p) * 0.12;
    if (particle.y < -4) { particle.y = canvasHeight + 4; particle.x = Math.random() * canvasWidth; }
    context.globalAlpha = 0.25 + 0.25 * Math.sin(seconds * 1.5 + particle.p);
    context.beginPath(); context.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2); context.fill();
  }
  context.globalAlpha = 1;
  animationFrame = requestAnimationFrame(drawBackground);
}

$("boot").addEventListener("click", startBoot);
$("play").addEventListener("click", () => activateSlot(currentSlot()));
$("sound").addEventListener("click", toggleMute);
$("install").addEventListener("click", installHelp);
$("install-system").addEventListener("click", installHelp);
row.addEventListener("pointerdown", pointerDown);
row.addEventListener("pointermove", pointerMove);
row.addEventListener("pointerup", pointerUp);
row.addEventListener("pointercancel", pointerUp);
row.addEventListener("wheel", pointerWheel, { passive: false });
window.addEventListener("keydown", (event) => {
  if (!bootStarted) {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); startBoot(); }
    return;
  }
  if (event.target instanceof HTMLElement && ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
  if (event.key === "ArrowDown") { event.preventDefault(); setHub(1); }
  else if (event.key === "ArrowUp") { event.preventDefault(); setHub(-1); }
  else if (event.key === "ArrowRight") { event.preventDefault(); moveCard(1); }
  else if (event.key === "ArrowLeft") { event.preventDefault(); moveCard(-1); }
  else if (event.key === "Enter" || event.key === " ") { event.preventDefault(); activateCurrent(); }
});
window.addEventListener("resize", () => { layout(); resizeCanvas(); });
window.addEventListener("online", updateConnection);
window.addEventListener("offline", updateConnection);
window.addEventListener("beforeinstallprompt", (event) => { event.preventDefault(); deferredInstallPrompt = event; $("install").classList.add("available"); });
window.addEventListener("appinstalled", () => { deferredInstallPrompt = null; toast("NJENGINE instalado."); });

const orientation = window.matchMedia("(pointer:coarse) and (orientation:portrait)");
function updateOrientation() { $("rotate").style.display = orientation.matches ? "flex" : "none"; }
orientation.addEventListener("change", updateOrientation);
updateOrientation();
const clock = () => updateClock();
clock(); window.setInterval(clock, 15_000);
updateConnection();
$("hints").innerHTML = window.matchMedia("(pointer:coarse)").matches || innerWidth < 900
  ? "<span>Deslize para os lados: jogos</span><span>Deslize para cima ou baixo: menus</span>"
  : "<span>↑ ↓ Menus</span><span>← → Navegar</span><span>Enter Jogar</span>";
renderHubs();
renderCards();
layout();
canvasContext = canvas.getContext("2d");
resizeCanvas();
animationFrame = requestAnimationFrame(drawBackground);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
window.addEventListener("pagehide", () => cancelAnimationFrame(animationFrame));

</script>
</body>
